<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake Capsule Official</title>
<script src="https://telegram.org"></script>
<style>
:root {
    --bg-color: #121212; --text-color: #ffffff;
    --panel-bg: rgba(255, 255, 255, 0.03); --panel-border: rgba(255, 255, 255, 0.08);
    --glass-bg: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1);
    --glass-highlight: rgba(255, 255, 255, 0.15); --shadow-color: rgba(0, 0, 0, 0.5);
    --accent-color: #00ff00;
}
[data-theme="light"] {
    --bg-color: #e0e4e8; --text-color: #1a1a1a;
    --panel-bg: rgba(0, 0, 0, 0.02); --panel-border: rgba(0, 0, 0, 0.1);
    --glass-bg: rgba(255, 255, 255, 0.4); --glass-border: rgba(255, 255, 255, 0.3);
    --glass-highlight: rgba(255, 255, 255, 0.6); --shadow-color: rgba(163, 177, 198, 0.6);
    --accent-color: #00aa00;
}
body {
    margin: 0; background: var(--bg-color); color: var(--text-color);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100vh; font-family: -apple-system, sans-serif;
    overflow: hidden; user-select: none; transition: background 0.3s;
}
.widget-bar { width: 320px; display: flex; justify-content: space-between; margin-bottom: 20px; }
.widget {
    padding: 8px 16px; border-radius: 30px; font-size: 13px; font-weight: 600;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.theme-toggle { cursor: pointer; }
.screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; }
.hidden { display: none !important; }
h1 { font-size: 46px; margin-bottom: 25px; color: var(--accent-color); text-shadow: 0 0 15px var(--accent-color); font-weight: 800; }

.menu-btn {
    width: 260px; padding: 16px; margin: 10px; color: var(--text-color);
    font-size: 16px; font-weight: 750; border-radius: 40px !important; border: 1px solid var(--glass-border);
    background: linear-gradient(135deg, var(--glass-bg), rgba(255,255,255,0.01));
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: inset 0 1px 0 var(--glass-highlight), 0 10px 25px var(--shadow-color);
    cursor: pointer; text-align: center; text-transform: uppercase; letter-spacing: 1px;
}
.menu-btn:active { transform: scale(0.97); border-color: var(--accent-color); color: var(--accent-color); }
.btn-main { border-color: var(--accent-color); }

.game-header { width: 320px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
#score { font-size: 24px; font-weight: 800; }
.exit-btn { background: #ff3344; color: white; border: none; padding: 10px 22px; font-weight: 700; border-radius: 25px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,51,68,0.3); }

canvas { border: 2px solid var(--panel-border); background: #000000; width: 320px; height: 320px; border-radius: 16px; box-shadow: 0 15px 35px var(--shadow-color); }
.controls { display: grid; grid-template-columns: repeat(3, 75px); gap: 14px; margin-top: 20px; }
.ctrl-btn { width: 75px; height: 75px; background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-color); font-size: 26px; border-radius: 50%; cursor: pointer; }
.ctrl-btn:active { border-color: var(--accent-color); color: var(--accent-color); }
.content-box { width: 85%; max-width: 320px; background: var(--panel-bg); border-radius: 24px; padding: 25px; text-align: center; border: 1px solid var(--panel-border); }
.modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
#historyList { max-height: 160px; overflow-y: auto; margin-top: 15px; }
.history-item { background: var(--glass-bg); padding: 10px; margin: 8px 0; border-radius: 12px; font-size: 15px; }
</style>
</head>
<body>
<div id="mainMenu" class="screen">
    <div class="widget-bar">
        <div class="widget theme-toggle" onclick="toggleTheme()">☀️ Тема</div>
        <div class="widget classMoscow">МСК: --:--:--</div>
    </div>
    <h1>ЗМЕЙКА</h1>
    <button class="menu-btn btn-main" onclick="openScreen('gameScreen'); startGame();">Играть</button>
    <button class="menu-btn" onclick="openScreen('achievementsScreen')">Достижения</button>
    <button class="menu-btn" onclick="openScreen('historyScreen'); showHistory();">История игр</button>
</div>

<div id="gameScreen" class="screen hidden">
    <div class="game-header">
        <div id="score">Счет: 0</div>
        <div class="widget classMoscow" style="margin:0;">МСК: --:--:--</div>
        <button class="exit-btn" onclick="pauseAndConfirmExit()">Выход</button>
    </div>
    <canvas id="gameCanvas" width="320" height="320"></canvas>
    <div class="controls">
        <button class="ctrl-btn" style="grid-column:2;" onclick="changeDir('up')">▲</button>
        <button class="ctrl-btn" style="grid-column:1;" onclick="changeDir('left')">◀</button>
        <button class="ctrl-btn" style="grid-column:3;" onclick="changeDir('right')">▶</button>
        <button class="ctrl-btn" style="grid-column:2;" onclick="changeDir('down')">▼</button>
    </div>
</div>

<div id="exitModal" class="modal hidden">
    <div class="content-box">
        <h2>Игра на паузе ⏸</h2>
        <p>Вы уверены, что хотите выйти? Прогресс будет потерян.</p>
        <button class="menu-btn btn-main" onclick="resumeGame()">Продолжить</button>
        <button class="menu-btn" style="background:#ff3344; border-color:#ff3344; color:white;" onclick="confirmExit()">Да, выйти</button>
    </div>
</div>

<div id="achievementsScreen" class="screen hidden">
    <div class="content-box">
        <h2>🏆 Достижения</h2>
        <p>🍏 Первый перекус</p>
        <p>🐍 Длинный хвост</p>
        <button class="menu-btn" style="width:100%;" onclick="openScreen('mainMenu')">Назад</button>
    </div>
</div>

<div id="historyScreen" class="screen hidden">
    <div class="content-box">
        <h2>📜 История игр</h2>
        <div id="historyList">Нет сыгранных матчей</div>
        <button class="menu-btn" style="width:100%; margin-top: 15px;" onclick="openScreen('mainMenu')">Назад</button>
    </div>
</div>
<script>
    var tg = window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    function updateMoscowTime() {
        var now = new Date();
        var msk = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + (3 * 3600000));
        var h = msk.getHours(); var m = msk.getMinutes(); var s = msk.getSeconds();
        if (h < 10) h = "0" + h; if (m < 10) m = "0" + m; if (s < 10) s = "0" + s;
        var clocks = document.getElementsByClassName("classMoscow");
        for (var i = 0; i < clocks.length; i++) { clocks[i].innerText = "МСК: " + h + ":" + m + ":" + s; }
    }
    setInterval(updateMoscowTime, 1000); updateMoscowTime();

    function toggleTheme() {
        var currentTheme = document.body.getAttribute("data-theme");
        if (currentTheme === "light") { document.body.removeAttribute("data-theme"); } 
        else { document.body.setAttribute("data-theme", "light"); }
    }

    function openScreen(screenId) {
        document.getElementById('mainMenu').className = 'screen hidden';
        document.getElementById('gameScreen').className = 'screen hidden';
        document.getElementById('achievementsScreen').className = 'screen hidden';
        document.getElementById('historyScreen').className = 'screen hidden';
        document.getElementById(screenId).className = 'screen';
        if (screenId !== 'gameScreen') { stopGame(); }
    }

    var canvas = document.getElementById("gameCanvas");
    var ctx = canvas.getContext("2d");
    var grid = 16; 
    
    var score = 0;
    var gameLoop = null;
    
    // ЖЕЛЕЗОБЕТОННЫЕ ЧИСТЫЕ МАССИВЫ ДЛЯ КООРДИНАТ БЕЗ СТРОК И ОПАСНЫХ СИМВОЛОВ
    var sBodyX = new Array();
    var sBodyY = new Array();
    
    var dx = 16; var dy = 0;
    var foodX = 0; var foodY = 0;
    var isPaused = false;

    function startGame() {
        score = 0; dx = 16; dy = 0; isPaused = false;
        document.getElementById('score').innerText = "Счет: " + score;
        document.getElementById('exitModal').className = 'modal hidden';
        
        sBodyX = new Array();
        sBodyY = new Array();
        
        // Задаем начальные три точки змейки цифрами через явный push
        sBodyX.push(96); sBodyY.push(80);
        sBodyX.push(80); sBodyY.push(80);
        sBodyX.push(64); sBodyY.push(80);
        
        generateFood();
        if (gameLoop) { clearInterval(gameLoop); }
        gameLoop = setInterval(updateGame, 160); 
    }

    function stopGame() { if (gameLoop) { clearInterval(gameLoop); gameLoop = null; } }
    function pauseAndConfirmExit() { isPaused = true; document.getElementById('exitModal').className = 'modal'; }
    function resumeGame() { isPaused = false; document.getElementById('exitModal').className = 'modal hidden'; }
    function confirmExit() { document.getElementById('exitModal').className = 'modal hidden'; saveMatchToHistory(score); stopGame(); openScreen('mainMenu'); }

    function generateFood() {
        foodX = Math.floor(Math.random() * 19 + 1) * 16;
        foodY = Math.floor(Math.random() * 19 + 1) * 16;
    }

    function updateGame() {
        if (isPaused) return;

        // Рассчитываем шаг следующей головы по первому элементу массивов (индекс 0)
        var headX = sBodyX.unshift() + dx; // Временный сдвиг заменен на явное чтение ниже
        var nextX = sBodyX.concat().shift() + dx;
        var nextY = sBodyY.concat().shift() + dy;

        if (nextX < 0 || nextX >= 320 || nextY < 0 || nextY >= 320) { endGameAction(); return; }
        
        // Проверка самопересечения
        for (var i = 0; i < sBodyX.length; i++) {
            if (nextX === sBodyX.concat().slice(i, i+1).shift() && nextY === sBodyY.concat().slice(i, i+1).shift()) {
                endGameAction(); return;
            }
        }

        // Вставляем новую голову вперед массивов через unshift
        sBodyX.unshift(nextX);
        sBodyY.unshift(nextY);

        if (nextX === foodX && nextY === foodY) {
            score = score + 10; 
            document.getElementById('score').innerText = "Счет: " + score; 
            generateFood();
        } else {
            // Удаляем хвост, если яблоко не съели
            sBodyX.pop();
            sBodyY.pop();
        }

        // ОТРИСОВКА НА КАНВАСЕ
        ctx.fillStyle = "#000000"; ctx.fillRect(0, 0, 320, 320); 
        ctx.fillStyle = "#FF0033"; ctx.fillRect(foodX, foodY, 14, 14); // НЕОНОВАЯ ЕДА

        // Отрисовка змейки из чистых числовых массивов без split и парсинга строк
        for (var k = 0; k < sBodyX.length; k++) {
            var activeX = sBodyX.concat().slice(k, k+1).shift();
            var activeY = sBodyY.concat().slice(k, k+1).shift();
            if (k === 0) {
                ctx.fillStyle = "#00FF00"; // ГОЛОВА
            } else {
                ctx.fillStyle = "#33FF33"; // ТЕЛО
            }
            ctx.fillRect(activeX, activeY, 14, 14);
        }
    }

    function changeDir(direction) {
        if (isPaused) return;
        if (direction === 'left' && dx === 0) { dx = -16; dy = 0; }
        if (direction === 'up' && dy === 0) { dx = 0; dy = -16; }
        if (direction === 'right' && dx === 0) { dx = 16; dy = 0; }
        if (direction === 'down' && dx === 0) { dx = 0; dy = 16; }
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') changeDir('up');
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') changeDir('down');
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') changeDir('left');
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') changeDir('right');
        if (e.key === 'Escape') pauseAndConfirmExit();
    });

    function saveMatchToHistory(finalScore) {
        var existingHistory = localStorage.getItem('snake_history');
        var historyArray = existingHistory ? existingHistory.split(',') : [];
        historyArray.unshift(finalScore); if (historyArray.length > 10) historyArray.pop();
        localStorage.setItem('snake_history', historyArray.join(','));
    }

    function showHistory() {
        var container = document.getElementById('historyList');
        var rawData = localStorage.getItem('snake_history');
        if (!rawData) { container.innerHTML = "Нет сыгранных матчей"; return; }
        var scores = rawData.split(','); var htmlContent = "";
        for (var i = 0; i < scores.length; i++) {
            var matchNum = i + 1; htmlContent += "<div class='history-item'>Игра #" + matchNum + " — " + scores[i] + " очков</div>";
        }
        container.innerHTML = htmlContent;
    }

    function endGameAction() { alert("Игра окончена! Ваш счет: " + score); saveMatchToHistory(score); stopGame(); openScreen('mainMenu'); }
</script>
</body>
</html>

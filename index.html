<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snake Game</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            margin: 0; background: #141414; color: white;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; font-family: 'Segoe UI', sans-serif;
            overflow: hidden; user-select: none;
        }
        /* Главное меню */
        .screen {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; width: 100%; height: 100%; position: absolute; top: 0; left: 0;
            background: #141414; z-index: 10; transition: 0.3s;
        }
        .hidden { display: none !important; }
        h1 { font-size: 42px; margin-bottom: 30px; color: #4CAF50; text-shadow: 0 0 10px rgba(76,175,80,0.3); }
        .menu-btn {
            width: 240px; padding: 15px; margin: 10px; background: #222; border: 2px solid #333;
            color: white; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.2s;
        }
        .menu-btn:active { background: #4CAF50; border-color: #4CAF50; transform: scale(0.98); }
        .btn-main { background: #4CAF50; border-color: #4CAF50; }
        .btn-main:active { background: #45a049; }
        
        /* Экран игры */
        #gameScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #score { font-size: 24px; margin-bottom: 10px; font-weight: bold; color: #aaa; }
        canvas { border: 2px solid #333; background: #000; max-width: 90vw; max-height: 45vh; border-radius: 10px; }
        .controls { display: grid; grid-template-columns: repeat(3, 75px); gap: 12px; margin-top: 20px; }
        .ctrl-btn { width: 75px; height: 75px; background: #252525; border: none; color: white; font-size: 26px; border-radius: 15px; }
        .ctrl-btn:active { background: #4CAF50; }

        /* Текстовые подстраницы */
        .content-box { width: 85%; max-width: 320px; background: #1c1c1c; border-radius: 16px; padding: 20px; border: 1px solid #333; text-align: center; }
        .content-box p { font-size: 18px; line-height: 1.6; margin: 10px 0; color: #ccc; }
    </style>
</head>
<body>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="mainMenu" class="screen">
        <h1>ЗМЕЙКА</h1>
        <button class="menu-btn btn-main" onclick="openScreen('gameScreen'); startGame();">ИГРАТЬ</button>
        <button class="menu-btn" onclick="openScreen('achievementsScreen')">ДОСТИЖЕНИЯ</button>
        <button class="menu-btn" onclick="openScreen('historyScreen')">ИСТОРИЯ ИГР</button>
    </div>

    <!-- ЭКРАН ИГРЫ -->
    <div id="gameScreen" class="screen hidden">
        <div id="score">Счет: 0</div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <button class="ctrl-btn" style="grid-column:2;" onclick="changeDir('up')">▲</button>
            <button class="ctrl-btn" style="grid-column:1;" onclick="changeDir('left')">◀</button>
            <button class="ctrl-btn" style="grid-column:3;" onclick="changeDir('right')">▶</button>
            <button class="ctrl-btn" style="grid-column:2;" onclick="changeDir('down')">▼</button>
        </div>
    </div>

    <!-- ЭКРАН ДОСТИЖЕНИЙ -->
    <div id="achievementsScreen" class="screen hidden">
        <div class="content-box">
            <h2>🏆 Достижения</h2>
            <p>🍏 <b>Первый перекус:</b> Съесть 1 яблоко</p>
            <p>🐍 <b>Длинный хвост:</b> Набрать 100 очков</p>
            <p>⚡ <b>Мастер маневров:</b> Набрать 300 очков</p>
            <button class="menu-btn" style="width:100%; margin:20px 0 0 0;" onclick="openScreen('mainMenu')">Назад</button>
        </div>
    </div>

    <!-- ЭКРАН ИСТОРИИ -->
    <div id="historyScreen" class="screen hidden">
        <div class="content-box">
            <h2>📜 История игр</h2>
            <p>Игра #1 — 0 очков</p>
            <p>Игра #2 — 0 очков</p>
            <p>Игра #3 — 0 очков</p>
            <button class="menu-btn" style="width:100%; margin:20px 0 0 0;" onclick="openScreen('mainMenu')">Назад</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Переключение экранов
        function openScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
            if (screenId !== 'gameScreen') stopGame();
        }

        // Логика игры
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const grid = 20;
        let score = 0;
        let gameLoop = null;

        let headX, headY, snake, dx, dy, food;

        function startGame() {
            headX = 160; headY = 160;
            snake = [{x: 160, y: 160}, {x: 140, y: 160}];
            dx = grid; dy = 0; score = 0;
            document.getElementById('score').innerText = "Счет: " + score;
            generateFood();
            if(gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(updateGame, 150);
        }

        function stopGame() {
            if(gameLoop) { clearInterval(gameLoop); gameLoop = null; }
        }

        function updateGame() {
            headX += dx; headY += dy;

            if (headX < 0 || headX >= canvas.width || headY < 0 || headY >= canvas.height) {
                alert("Игра окончена! Ваш счет: " + score);
                openScreen('mainMenu');
                return;
            }

            snake.unshift({x: headX, y: headY});

            if (headX === food.x && headY === food.y) {
                score += 10;
                document.getElementById('score').innerText = "Счет: " + score;
                generateFood();
            } else {
                snake.pop();
            }

            ctx.fillStyle = "black"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#FF5252'; ctx.fillRect(food.x, food.y, grid-2, grid-2);
            ctx.fillStyle = '#4CAF50'; snake.forEach(part => ctx.fillRect(part.x, part.y, grid-2, grid-2));
        }

        function changeDir(direction) {
            if (direction === 'left' && dx === 0) { dx = -grid; dy = 0; }
            if (direction === 'up' && dy === 0) { dx = 0; dy = -grid; }
            if (direction === 'right' && dx === 0) { dx = grid; dy = 0; }
            if (direction === 'down' && dy === 0) { dx = 0; dy = grid; }
        }

        function generateFood() {
            food = {
                x: Math.floor(Math.random() * (canvas.width / grid)) * grid,
                y: Math.floor(Math.random() * (canvas.height / grid)) * grid
            };
        }
    </script>
</body>
</html>

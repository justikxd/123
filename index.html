<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Змейка в Telegram</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            margin: 0; background: #1a1a1a; color: white;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; font-family: sans-serif;
            overflow: hidden; user-select: none;
        }
        #score { font-size: 24px; margin-bottom: 10px; font-weight: bold; }
        canvas { border: 2px solid #333; background: #000; max-width: 90vw; max-height: 50vh; border-radius: 10px; }
        .controls { display: grid; grid-template-columns: repeat(3, 75px); gap: 12px; margin-top: 25px; }
        .btn { width: 75px; height: 75px; background: #333; border: none; color: white; font-size: 26px; border-radius: 15px; }
        .btn:active { background: #555; }
        .btn-up { grid-column: 2; }
        .btn-left { grid-column: 1; }
        .btn-right { grid-column: 3; }
        .btn-down { grid-column: 2; }
    </style>
</head>
<body>
    <div id="score">Счет: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div class="controls">
        <button class="btn btn-up" onclick="changeDir('up')">▲</button>
        <button class="btn btn-left" onclick="changeDir('left')">◀</button>
        <button class="btn btn-right" onclick="changeDir('right')">▶</button>
        <button class="btn btn-down" onclick="changeDir('down')">▼</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const grid = 20;
        let score = 0;

        let snake = [{x: 160, y: 160}, {x: 140, y: 160}, {x: 120, y: 160}];
        let dx = grid;
        let dy = 0;
        let food = {x: 300, y: 200};

        function main() {
            if (hasGameEnded()) {
                alert("Игра окончена! Ваш счет: " + score);
                resetGame();
            } else {
                clearCanvas();
                drawFood();
                moveSnake();
                drawSnake();
            }
        }

        function clearCanvas() { 
            ctx.fillStyle = "black"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height); 
        }

        function drawSnake() { 
            ctx.fillStyle = '#4CAF50'; 
            snake.forEach(part => ctx.fillRect(part.x, part.y, grid-2, grid-2)); 
        }

        function drawFood() { 
            ctx.fillStyle = '#FF5252'; 
            ctx.fillRect(food.x, food.y, grid-2, grid-2); 
        }

        function moveSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').innerText = "Счет: " + score;
                generateFood();
            } else { 
                snake.pop(); 
            }
        }

        function changeDir(direction) {
            if (direction === 'left' && dx === 0) { dx = -grid; dy = 0; }
            if (direction === 'up' && dy === 0) { dx = 0; dy = -grid; }
            if (direction === 'right' && dx === 0) { dx = grid; dy = 0; }
            if (direction === 'down' && dy === 0) { dx = 0; dy = grid; }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * (canvas.width / grid)) * grid;
            food.y = Math.floor(Math.random() * (canvas.height / grid)) * grid;
        }

        function hasGameEnded() {
            const head = snake[0];
            for (let i = 4; i < snake.length; i++) { 
                if (snake[i].x === head.x && snake[i].y === head.y) return true; 
            }
            return head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height;
        }

        function resetGame() { 
            snake = [{x: 160, y: 160}, {x: 140, y: 160}, {x: 120, y: 160}]; 
            dx = grid; 
            dy = 0; 
            score = 0; 
            document.getElementById('score').innerText = "Счет: " + score;
            generateFood(); 
        }

        generateFood();
        setInterval(main, 150);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake Game Official</title>
<script src="https://telegram.org"></script>
<style>
body {
    margin: 0; background: #141414; color: white;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100vh; font-family: sans-serif;
    overflow: hidden; user-select: none;
}
.screen {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; width: 100%; height: 100%; position: absolute;
    top: 0; left: 0; background: #141414; z-index: 10;
}
.hidden { display: none !important; }
h1 { font-size: 42px; margin-bottom: 30px; color: #00FF00; text-shadow: 0 0 10px #00FF00; }
.menu-btn {
    width: 240px; padding: 15px; margin: 10px; background: #222;
    border: 2px solid #333; color: white; font-size: 18px; font-weight: bold;
    border-radius: 12px; cursor: pointer;
}
.menu-btn:active { background: #00FF00; border-color: #00FF00; color: black; }
.btn-main { background: #00FF00; border-color: #00FF00; color: black; }
#gameScreen {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
}
.game-header {
    width: 320px; display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 10px;
}
#score { font-size: 24px; font-weight: bold; color: #aaa; }
.exit-btn {
    background: #FF0033; color: white; border: none;
    padding: 8px 16px; font-weight: bold; border-radius: 8px; cursor: pointer; z-index: 20;
}
.exit-btn:active { background: #cc0029; }
canvas {
    border: 2px solid #333; background: #000;
    width: 320px; height: 320px; border-radius: 10px;
}
.controls { display: grid; grid-template-columns: repeat(3, 75px); gap: 12px; margin-top: 20px; }
.ctrl-btn {
    width: 75px; height: 75px; background: #252525; border: none;
    color: white; font-size: 26px; border-radius: 15px; cursor: pointer;
}
.ctrl-btn:active { background: #00FF00; }
.content-box {
    width: 85%; max-width: 320px; background: #1c1c1c;
    border-radius: 16px; padding: 20px; text-align: center; border: 1px solid #333;
}
.modal {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8); z-index: 100; display: flex;
    align-items: center; justify-content: center;
}
#historyList {
    max-height: 150px; overflow-y: auto; margin-top: 10px; padding: 5px;
}
.history-item {
    background: #2b2b2b; padding: 8px; margin: 5px 0; border-radius: 6px; font-size: 16px;
}
</style>
</head>
<body>

<div id="mainMenu" class="screen">
    <h1>ЗМЕЙКА</h1>
    <button class="menu-btn btn-main" onclick="openScreen('gameScreen'); startGame();">ИГРАТЬ</button>
    <button class="menu-btn" onclick="openScreen('achievementsScreen')">ДОСТИЖЕНИЯ</button>
    <button class="menu-btn" onclick="openScreen('historyScreen'); showHistory();">ИСТОРИЯ ИГР</button>
</div>

<div id="gameScreen" class="screen hidden">
    <div class="game-header">
        <div id="score">Счет: 0</div>
        <button class="exit-btn" onclick="pauseAndConfirmExit()">Выход</button>
    </div>
    <canvas id="gameCanvas" width="320" height="320"></canvas>
    <div class="controls">
        <button class="ctrl-btn" style="grid-column:2;" onclick="changeDir('up')">▲</button>
        <button class="ctrl-btn" style="grid-column:1;" onclick="changeDir('left')">◀</button>
        <button class="ctrl-btn" style="grid-column:3;" onclick="changeDir('right')">▶</button>
        <button class="ctrl-btn" style="grid-column:2;" onclick="changeDir('down')">▼</button>
    </div>
</div>

<div id="exitModal" class="modal hidden">
    <div class="content-box">
        <h2>Игра на паузе ⏸</h2>
        <p>Вы уверены, что хотите выйти? Прогресс будет потерян.</p>
        <button class="menu-btn btn-main" onclick="resumeGame()">Продолжить</button>
        <button class="menu-btn" style="background:#FF0033; border-color:#FF0033; color: white;" onclick="confirmExit()">Да, выйти</button>
    </div>
</div>

<div id="achievementsScreen" class="screen hidden">
    <div class="content-box">
        <h2>🏆 Достижения</h2>
        <p>🍏 Первый перекус</p>
        <p>🐍 Длинный хвост</p>
        <button class="menu-btn" style="width:100%;" onclick="openScreen('mainMenu')">Назад</button>
    </div>
</div>

<div id="historyScreen" class="screen hidden">
    <div class="content-box">
        <h2>📜 История игр</h2>
        <div id="historyList">Нет сыгранных матчей</div>
        <button class="menu-btn" style="width:100%; margin-top: 15px;" onclick="openScreen('mainMenu')">Назад</button>
    </div>
</div>
<script>
    var tg = window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    function openScreen(screenId) {
        document.getElementById('mainMenu').className = 'screen hidden';
        document.getElementById('gameScreen').className = 'screen hidden';
        document.getElementById('achievementsScreen').className = 'screen hidden';
        document.getElementById('historyScreen').className = 'screen hidden';
        document.getElementById(screenId).className = 'screen';
        if (screenId !== 'gameScreen') { stopGame(); }
    }

    var canvas = document.getElementById("gameCanvas");
    var ctx = canvas.getContext("2d");
    
    var score = 0;
    var gameLoop = null;
    
    var snakeStr = ""; 
    var headX = 96;
    var headY = 80;
    
    var dx = 16;
    var dy = 0;
    var foodX = 0;
    var foodY = 0;
    var isPaused = false;

    function startGame() {
        score = 0; dx = 16; dy = 0; headX = 96; headY = 80; isPaused = false;
        document.getElementById('score').innerText = "Счет: " + score;
        document.getElementById('exitModal').className = 'modal hidden';
        
        snakeStr = "80_80,64_80"; 
        generateFood();
        
        if (gameLoop) { clearInterval(gameLoop); }
        gameLoop = setInterval(updateGame, 160); 
    }

    function stopGame() {
        if (gameLoop) { clearInterval(gameLoop); gameLoop = null; }
    }

    function pauseAndConfirmExit() {
        isPaused = true;
        document.getElementById('exitModal').className = 'modal';
    }

    function resumeGame() {
        isPaused = false; 
        document.getElementById('exitModal').className = 'modal hidden';
    }

    function confirmExit() {
        document.getElementById('exitModal').className = 'modal hidden';
        saveMatchToHistory(score);
        stopGame(); openScreen('mainMenu');
    }

    function generateFood() {
        foodX = Math.floor(Math.random() * 19 + 1) * 16;
        foodY = Math.floor(Math.random() * 19 + 1) * 16;
    }

    function updateGame() {
        if (isPaused) return;

        if (snakeStr !== "") {
            snakeStr = headX + "_" + headY + "," + snakeStr;
        } else {
            snakeStr = headX + "_" + headY;
        }

        headX = headX + dx; 
        headY = headY + dy;

        if (headX < 0 || headX >= 320 || headY < 0 || headY >= 320) {
            endGameAction(); return;
        }

        if (snakeStr.indexOf(headX + "_" + headY) !== -1) {
            endGameAction(); return;
        }

        if (headX === foodX && headY === foodY) {
            score = score + 10;
            document.getElementById('score').innerText = "Счет: " + score;
            generateFood();
        } else {
            var lastComma = snakeStr.lastIndexOf(",");
            if (lastComma !== -1) {
                snakeStr = snakeStr.substring(0, lastComma);
            }
        }

        // Очищаем экран глубоким черным
        ctx.fillStyle = "#000000"; ctx.fillRect(0, 0, 320, 320);
        
        // Рисуем ЯРКО-КРАСНУЮ (НЕОНОВУЮ) еду
        ctx.fillStyle = "#FF0033"; ctx.fillRect(foodX, foodY, 14, 14);
        
        // Рисуем ЯРКО-ЗЕЛЕНУЮ голову змейки
        ctx.fillStyle = "#00FF00"; ctx.fillRect(headX, headY, 14, 14);

        // Рисуем тело змейки ярко-зеленым цветом
        ctx.fillStyle = "#33FF33";
        var segments = snakeStr.split(",");
        for (var i = 0; i < segments.length; i++) {
            if (segments[i] !== "") {
                var coords = segments[i].split("_");
                var partX = parseInt(coords[0], 10); // Безопасное чтение X по индексу
                var partY = parseInt(coords[1], 10); // Безопасное чтение Y по индексу
                ctx.fillRect(partX, partY, 14, 14);
            }
        }
    }

    function changeDir(direction) {
        if (isPaused) return;
        if (direction === 'left' && dx === 0) { dx = -16; dy = 0; }
        if (direction === 'up' && dy === 0) { dx = 0; dy = -16; }
        if (direction === 'right' && dx === 0) { dx = 16; dy = 0; }
        if (direction === 'down' && dy === 0) { dx = 0; dy = 16; }
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { changeDir('up'); }
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { changeDir('down'); }
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { changeDir('left'); }
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { changeDir('right'); }
        if (e.key === 'Escape') { pauseAndConfirmExit(); }
    });

    function saveMatchToHistory(finalScore) {
        var existingHistory = localStorage.getItem('snake_history');
        var historyArray = existingHistory ? existingHistory.split(',') : [];
        historyArray.unshift(finalScore);
        if (historyArray.length > 10) { historyArray.pop(); }
        localStorage.setItem('snake_history', historyArray.join(','));
    }

    function showHistory() {
        var container = document.getElementById('historyList');
        var rawData = localStorage.getItem('snake_history');
        if (!rawData) {
            container.innerHTML = "Нет сыгранных матчей";
            return;
        }
        var scores = rawData.split(',');
        var htmlContent = "";
        for (var i = 0; i < scores.length; i++) {
            var matchNum = i + 1;
            htmlContent += "<div class='history-item'>Игра #" + matchNum + " — " + scores[i] + " очков</div>";
        }
        container.innerHTML = htmlContent;
    }

    function endGameAction() {
        alert("Игра окончена! Ваш счет: " + score);
        saveMatchToHistory(score);
        stopGame(); openScreen('mainMenu');
    }
</script>
</body>
</html>
